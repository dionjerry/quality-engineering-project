name: ubulu-qa-assessment

services:
  restful-booker:
    image: mwinteringham/restfulbooker@sha256:e4a04233731ceca2e6d99bca16689e0d4bc44631047ab351b6f11b5fa08fb418
    platform: linux/amd64
    ports:
      - "${RESTFUL_BOOKER_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3001/ping"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

